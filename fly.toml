# Fly.io config. See DEPLOY.md for the steps.
app = "yorm" # must be unique on Fly; change it if "yorm" is taken
primary_region = "iad" # Ashburn, Virginia; next to Neon's aws-us-east-1

# yormd saves every running session when it gets SIGINT; give it time.
kill_signal = "SIGINT"
kill_timeout = "20s"

[build]
  build-target = "fly"

[env]
  YORM_UPLOAD_DIR = "/data/uploads"

# Uploaded maps and token pictures.
[mounts]
  source = "yorm_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is connected (open WebSockets count as connected),
  # and wake on the next visit. Session state is in Postgres either way.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Each player's WebSocket is one connection.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/livez" # not /healthz, which pings the database
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
