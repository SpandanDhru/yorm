services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yorm
      POSTGRES_PASSWORD: yorm
      POSTGRES_DB: yorm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yorm -d yorm"]
      interval: 2s
      timeout: 3s
      retries: 15

  yormd:
    build: .
    environment:
      DATABASE_URL: postgres://yorm:yorm@postgres:5432/yorm?sslmode=disable
      YORM_TOKEN_SECRET: dev-only-secret-do-not-use-in-prod-0123456789
      YORM_ALLOWED_ORIGINS: localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy

  # docker compose --profile monitoring up: Prometheus on :9090, Grafana on :3000.
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/yorm.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
